name: paper
# Builds paper/ms.pdf from the committed sources (generated macros, tables, figures) with AASTeX 7.0.1 from CTAN.
# Runs in the official TeX Live 2023 container, so no Ubuntu package mirror is needed (the hosted runners' mirror kept failing).
# Manual trigger only. The PDF is uploaded as a workflow artifact; nothing is released or submitted.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: texlive/texlive:TL2023-historic  # TeX Live 2023; AASTeX 7.0.1 long tables fail with TeX Live 2025
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          command -v curl >/dev/null && command -v unzip >/dev/null || { apt-get update -q && apt-get install -y -q curl unzip; }
      - name: AASTeX 7.0.1 from CTAN
        run: |
          curl -sSL --retry 5 -o /tmp/aastex.zip https://mirrors.ctan.org/macros/latex/contrib/aastex.zip
          unzip -q /tmp/aastex.zip -d /tmp/aastex
          cp $(find /tmp/aastex -name 'aastex701.cls') paper/
          cp $(find /tmp/aastex -name 'aasjournalv7.bst') paper/
      - name: Build
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error ms.tex
          bibtex ms
          pdflatex -interaction=nonstopmode -halt-on-error ms.tex
          pdflatex -interaction=nonstopmode -halt-on-error ms.tex
          pdflatex -interaction=nonstopmode -halt-on-error ms.tex
          grep -E "Warning|undefined" ms.log | sort | uniq -c | sort -rn | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-pdf
          path: |
            paper/ms.pdf
            paper/ms.log
            paper/ms.blg
