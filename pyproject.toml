[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-gargantua"
version = "0.1.2"
description = "An automated, ML-driven TESS exoplanet detection and vetting pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Srijeet Prasad Banerjee", email = "srijeetprasadbanerjee006@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "lightkurve",
    "batman-package",
    "emcee",
    "scikit-learn",
    "numpy<2.0",
    "scipy",
    "matplotlib",
    "astropy",
    "astroquery",
    "pandas",
    "ldtk",
    "corner",
    "joblib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/bytes06runner/exo_gargantua"
Repository = "https://github.com/bytes06runner/exo_gargantua.git"
Issues = "https://github.com/bytes06runner/exo_gargantua/issues"

[tool.setuptools]
packages = ["exoplanet_pipeline"]
