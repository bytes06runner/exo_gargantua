[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-gargantua"
version = "2.0.0.dev0"
description = "Calibrated resolution of orbital-period aliases in TESS transit signals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Srijeet Prasad Banerjee" }]
# Pinned for reproducibility; update deliberately and record in results files.
dependencies = [
  "numpy==2.0.2",
  "scipy==1.17.1",
  "astropy==8.0.1",
  "lightkurve==2.6.0",
  "astroquery==0.4.11",
  "pandas==2.3.3",
  "wotan==1.10",
  "transitleastsquares==1.32",
  "batman-package==2.5.3",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "psutil==7.2.2",
  "bottleneck==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/bytes06runner/exo_gargantua"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (bibliography resolution)"]
